<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración | Distribuidora A.L.F.</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">A.L.F.</span><span><b>Administración</b><small>Panel privado</small></span></a><a class="admin-link" href="index.html">Ver tienda</a></header>
<main class="container admin-container">
  <section id="login-view" class="login-card"><p class="eyebrow">ACCESO RESTRINGIDO</p><h1>Panel de administración</h1><p class="muted">Ingresá la contraseña configurada en Netlify.</p><form id="login-form"><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="primary-button full">Ingresar</button><p id="login-error" class="error"></p></form></section>
  <section id="admin-view" hidden>
    <div class="section-heading"><div><p class="eyebrow">GESTIÓN</p><h1>Productos del catálogo</h1></div><button id="logout" class="secondary-button">Cerrar sesión</button></div>
    <form id="product-form" class="admin-form">
      <h2 id="form-title">Agregar producto</h2><input type="hidden" id="product-id">
      <div class="form-grid">
        <label>Nombre<input id="name" required maxlength="100"></label>
        <label>Precio (ARS)<input id="price" type="number" min="0" step="1" required></label>
        <label>Categoría<input id="category-input" placeholder="Accesorios, higiene, insumos..."></label>
        <label>Marca<input id="brand"></label>
        <label>Presentación<input id="presentation" placeholder="Unidad, pack, caja..."></label>
        <label>Código<input id="code"></label>
        <label>Vencimiento (si corresponde)<input id="expiry" type="date"></label>
        <label>Imagen (URL)<input id="image" type="url" placeholder="https://..."></label>
        <label class="wide">Descripción<textarea id="description" rows="3"></textarea></label>
      </div>
      <div class="form-actions"><label class="check-label"><input id="available" type="checkbox" checked> Disponible</label><label class="check-label"><input id="active" type="checkbox" checked> Visible en la tienda</label><button class="primary-button">Guardar producto</button><button type="button" id="cancel-edit" class="secondary-button">Limpiar</button></div>
    </form>
    <div class="section-heading"><h2>Listado</h2><input id="admin-search" placeholder="Buscar en administración..."></div>
    <div id="admin-products" class="admin-list"></div>
  </section>
</main><script src="admin.js"></script>
</body></html>
